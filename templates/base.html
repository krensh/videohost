{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}TsundereTube{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- Левая реклама (на сливовом фоне) -->
    <div class="ad-column left">
        <div class="ad-box"></div>
        <div class="ad-box"></div>
        <div class="ad-box"></div>
    </div>

    <!-- Центральный блок сайта (скроллится только он) -->
    <div class="site-container">
        <header class="site-header">
            <a href="{% url 'index' %}" class="logo">TsundereTube</a>
            <nav>
                <a href="{% url 'shop' %}">Магазин</a>
            </nav>
        </header>

        <main class="site-main">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Правая реклама -->
    <div class="ad-column right">
        <div class="ad-box"></div>
        <div class="ad-box"></div>
    </div>

    <!-- ВИДЖЕТ ЦТ (Поверх всего) -->
    <div id="tsundere-box" class="in-corner">

        <!-- Текст (в углу сверху, в центре справа) -->
        <div class="tsundere-content">
            <div class="tsundere-bubble" id="tsundere-bubble">...</div>
            <div class="tsundere-poll" id="tsundere-poll" hidden>
                <button class="poll-btn" data-answer="yes">Да</button>
                <button class="poll-btn" data-answer="no">Нет</button>
            </div>
        </div>

        <!-- Картинка (в углу снизу, в центре слева) -->
        <img src="{% static 'img/tsundere.png' %}" alt="ЦТ" class="tsundere-img">

    </div>

    <script src="{% static 'js/tsundere.js' %}"></script>
</body>
</html>

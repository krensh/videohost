{% extends 'base.html' %}
{% load static %}
{% block title %}Каталог — TsundereTube{% endblock %}
{% block content %}
<h1>Каталог аниме</h1>
<div class="catalog-grid">
    <!-- Делаем 12 карточек (4 в ряд, 3 в столбец) -->
    {% for i in "123456789012" %}
    <div class="catalog-card glass-panel">
        <img src="{% static 'img/poster.jpg' %}" alt="Постер" class="card-poster">
        <div class="card-content">
            <div class="card-title">Название тайтла {{ forloop.counter }}</div>
            <a href="{% url 'watch' 1 %}" class="card-btn">Смотреть</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
